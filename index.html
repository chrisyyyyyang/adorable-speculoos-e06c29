<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甯寓員工預假專用網 - 115年度</title>
    <style>
        :root {
            --admin-color: #f1c40f;
            --admin-bg: #fffde7;
            --nursing-color: #d87093;
            --nursing-bg: #fdf0f4;
            --beauty-color: #7b68ee;
            --beauty-bg: #f3f0ff;
            --primary-bg: #f8f9fa;
            --card-border: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.5;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        header h1 {
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 員工圖例與選擇區 */
        .controls-panel {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #34495e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .department-group {
            margin-bottom: 15px;
        }

        .dept-label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }

        .dept-admin .dept-label { color: #b7950b; }
        .dept-nursing .dept-label { color: #c2185b; }
        .dept-beauty .dept-label { color: #512da8; }

        .staff-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .staff-btn {
            padding: 8px 16px;
            border: 2px solid transparent;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            background: #f0f0f0;
            color: #444;
        }

        .staff-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .staff-btn.active {
            font-weight: bold;
            border-color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* 顏色標籤特化 */
        .staff-btn[data-dept="admin"] { background-color: #fef9e7; color: #7d6608; border-color: #f1c40f; }
        .staff-btn[data-dept="admin"].active { background-color: #f1c40f; color: #fff; }

        .staff-btn[data-dept="nursing"] { background-color: #fdf0f4; color: #880e4f; border-color: #d87093; }
        .staff-btn[data-dept="nursing"].active { background-color: #d87093; color: #fff; }

        .staff-btn[data-dept="beauty"] { background-color: #f3f0ff; color: #4a148c; border-color: #7b68ee; }
        .staff-btn[data-dept="beauty"].active { background-color: #7b68ee; color: #fff; }

        .current-selected-info {
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #eef2f7;
            border-radius: 8px;
            font-size: 14px;
            color: #2c3e50;
        }

        /* 月份分頁選單 */
        .month-tabs {
            display: flex;
            overflow-x: auto;
            gap: 6px;
            background: #fff;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            scrollbar-width: thin;
        }

        .month-tab {
            flex: 0 0 auto;
            padding: 10px 18px;
            border: none;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #666;
            transition: all 0.2s ease;
        }

        .month-tab:hover {
            background: #e9ecef;
            color: #333;
        }

        .month-tab.active {
            background: #2c3e50;
            color: #fff;
        }

        /* 日曆區塊 */
        .calendar-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-title {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .weekday-header {
            text-align: center;
            padding: 10px;
            font-weight: bold;
            background: #f1f3f5;
            border-radius: 6px;
            color: #495057;
            font-size: 14px;
        }

        .weekday-header.weekend {
            color: #e74c3c;
        }

        .calendar-day {
            min-height: 100px;
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
        }

        .calendar-day:hover {
            background-color: #f8f9fa;
            border-color: #adb5bd;
        }

        .calendar-day.empty {
            background: #fdfdfd;
            border: 1px dashed #eee;
            cursor: default;
        }

        .day-number {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
        }

        .calendar-day.weekend .day-number {
            color: #e74c3c;
        }

        .leave-tags {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            max-height: 80px;
        }

        .leave-tag {
            font-size: 12px;
            padding: 3px 6px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .leave-tag.admin {
            background-color: #fef9e7;
            color: #7d6608;
            border-left: 3px solid #f1c40f;
        }

        .leave-tag.nursing {
            background-color: #fdf0f4;
            color: #880e4f;
            border-left: 3px solid #d87093;
        }

        .leave-tag.beauty {
            background-color: #f3f0ff;
            color: #4a148c;
            border-left: 3px solid #7b68ee;
        }

        .remove-btn {
            font-size: 10px;
            margin-left: 4px;
            color: #999;
            cursor: pointer;
            font-weight: bold;
        }

        .remove-btn:hover {
            color: #ff4d4f;
        }

        /* 統計資訊 */
        .summary-card {
            margin-top: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .summary-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }

        .summary-item {
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .calendar-grid {
                grid-template-columns: repeat(7, 1fr);
                gap: 4px;
            }
            
            .calendar-day {
                min-height: 70px;
                padding: 4px;
            }

            .day-number {
                font-size: 12px;
            }

            .leave-tag {
                font-size: 10px;
                padding: 2px 4px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏥 甯寓員工預假專用網 (民國115年 / 2026)</h1>
        <div class="subtitle">點選下方員工名字後，直接點擊日曆日期即可「新增/取消」預計休假</div>
    </header>

    <!-- 控制面板：選擇員工 -->
    <div class="controls-panel">
        <div class="section-title">👤 請先選擇填假員工：</div>
        
        <div class="department-group dept-admin">
            <span class="dept-label">行政部</span>
            <div class="staff-buttons">
                <button class="staff-btn" data-dept="admin" data-name="Joe">Joe</button>
                <button class="staff-btn" data-dept="admin" data-name="宇成">宇成</button>
            </div>
        </div>

        <div class="department-group dept-nursing">
            <span class="dept-label">護理部</span>
            <div class="staff-buttons">
                <button class="staff-btn" data-dept="nursing" data-name="怡伶">怡伶</button>
                <button class="staff-btn" data-dept="nursing" data-name="孟婷">孟婷</button>
                <button class="staff-btn" data-dept="nursing" data-name="涵方">涵方</button>
            </div>
        </div>

        <div class="department-group dept-beauty">
            <span class="dept-label">美容部</span>
            <div class="staff-buttons">
                <button class="staff-btn" data-dept="beauty" data-name="姿姿">姿姿</button>
                <button class="staff-btn" data-dept="beauty" data-name="冠穎">冠穎</button>
                <button class="staff-btn" data-dept="beauty" data-name="欣亞">欣亞</button>
                <button class="staff-btn" data-dept="beauty" data-name="佳璇">佳璇</button>
            </div>
        </div>

        <div class="current-selected-info">
            目前選取人員：<strong id="selected-staff-display" style="color: #e74c3c;">未選擇（請點擊上方名字）</strong>
        </div>
    </div>

    <!-- 月份分頁選單 -->
    <div class="month-tabs" id="month-tabs">
        <!-- JS 動態生成 1 ~ 12 月 -->
    </div>

    <!-- 日曆主區塊 -->
    <div class="calendar-card">
        <div class="calendar-header">
            <div class="calendar-title" id="calendar-title">民國 115 年 1 月</div>
            <span style="font-size: 13px; color: #7f8c8d;">* 點擊日期可切換該員工預假狀態</span>
        </div>
        <div class="calendar-grid" id="calendar-grid">
            <!-- 星期標頭 -->
            <div class="weekday-header weekend">日</div>
            <div class="weekday-header">一</div>
            <div class="weekday-header">二</div>
            <div class="weekday-header">三</div>
            <div class="weekday-header">四</div>
            <div class="weekday-header">五</div>
            <div class="weekday-header weekend">六</div>
            
            <!-- 日期格子由 JS 生成 -->
        </div>
    </div>

    <!-- 本月預假統計區 -->
    <div class="summary-card">
        <div class="section-title">📊 本月預假統計</div>
        <div class="summary-list" id="summary-list">
            <!-- JS 動態生成統計內容 -->
        </div>
    </div>
</div>

<script>
    // 西元 2026 年對應民國 115 年
    const YEAR = 2026;
    const ROC_YEAR = 115;

    // 當前選取的員工與月份
    let currentStaff = null; // { name, dept }
    let currentMonth = 1;

    // 休假資料儲存 Key: "YYYY-MM-DD", Value: Array of { name, dept }
    let leaveData = JSON.parse(localStorage.getItem('ningyu_leave_data')) || {};

    // 初始化月份分頁
    function initMonthTabs() {
        const tabsContainer = document.getElementById('month-tabs');
        tabsContainer.innerHTML = '';
        for (let m = 1; m <= 12; m++) {
            const btn = document.createElement('button');
            btn.className = `month-tab ${m === currentMonth ? 'active' : ''}`;
            btn.textContent = `115年 ${m}月`;
            btn.onclick = () => {
                currentMonth = m;
                document.querySelectorAll('.month-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderCalendar();
                renderSummary();
            };
            tabsContainer.appendChild(btn);
        }
    }

    // 初始化員工選擇按鈕
    function initStaffButtons() {
        const buttons = document.querySelectorAll('.staff-btn');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStaff = {
                    name: btn.dataset.name,
                    dept: btn.dataset.dept
                };
                document.getElementById('selected-staff-display').textContent = `${currentStaff.name} (${getDeptName(currentStaff.dept)})`;
            });
        });
    }

    function getDeptName(dept) {
        switch(dept) {
            case 'admin': return '行政部';
            case 'nursing': return '護理部';
            case 'beauty': return '美容部';
            default: return '';
        }
    }

    // 渲染日曆
    function renderCalendar() {
        document.getElementById('calendar-title').textContent = `民國 ${ROC_YEAR} 年 ${currentMonth} 月`;
        const grid = document.getElementById('calendar-grid');
        
        // 移除先前的日期格子（保留前 7 個星期標題）
        while (grid.children.length > 7) {
            grid.removeChild(grid.lastChild);
        }

        // 計算當月第一天是星期幾 & 當月總天數
        const firstDay = new Date(YEAR, currentMonth - 1, 1).getDay();
        const daysInMonth = new Date(YEAR, currentMonth, 0).getDate();

        // 填充當月首日前的空白格子
        for (let i = 0; i < firstDay; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'calendar-day empty';
            grid.appendChild(emptyCell);
        }

        // 生成當月天數格子
        for (let day = 1; day <= daysInMonth; day++) {
            const dayCell = document.createElement('div');
            const dayOfWeek = (firstDay + day - 1) % 7;
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
            
            dayCell.className = `calendar-day ${isWeekend ? 'weekend' : ''}`;
            
            const monthStr = String(currentMonth).padStart(2, '0');
            const dayStr = String(day).padStart(2, '0');
            const dateKey = `${YEAR}-${monthStr}-${dayStr}`;

            // 日期數字
            const dayNum = document.createElement('div');
            dayNum.className = 'day-number';
            dayNum.textContent = day;
            dayCell.appendChild(dayNum);

            // 休假標籤容器
            const tagsContainer = document.createElement('div');
            tagsContainer.className = 'leave-tags';

            const dayLeaves = leaveData[dateKey] || [];
            dayLeaves.forEach(item => {
                const tag = document.createElement('div');
                tag.className = `leave-tag ${item.dept}`;
                tag.innerHTML = `<span>${item.name}</span><span class="remove-btn">✕</span>`;
                
                // 標籤內部 X 按鈕點擊事件：獨立刪除
                tag.querySelector('.remove-btn').onclick = (e) => {
                    e.stopPropagation();
                    toggleLeave(dateKey, item);
                };
                
                tagsContainer.appendChild(tag);
            });

            dayCell.appendChild(tagsContainer);

            // 點擊整天格子切換目前所選人員的預假狀態
            dayCell.onclick = () => {
                if (!currentStaff) {
                    alert('請先點擊上方選單選擇填假員工！');
                    return;
                }
                toggleLeave(dateKey, currentStaff);
            };

            grid.appendChild(dayCell);
        }
    }

    // 切換預假狀態 (新增/刪除)
    function toggleLeave(dateKey, staff) {
        if (!leaveData[dateKey]) {
            leaveData[dateKey] = [];
        }

        const index = leaveData[dateKey].findIndex(item => item.name === staff.name);
        if (index > -1) {
            // 已存在則取消
            leaveData[dateKey].splice(index, 1);
            if (leaveData[dateKey].length === 0) {
                delete leaveData[dateKey];
            }
        } else {
            // 不存在則新增
            leaveData[dateKey].push({ name: staff.name, dept: staff.dept });
        }

        // 存入 localStorage
        localStorage.setItem('ningyu_leave_data', JSON.stringify(leaveData));
        renderCalendar();
        renderSummary();
    }

    // 渲染月度統計
    function renderSummary() {
        const summaryContainer = document.getElementById('summary-list');
        summaryContainer.innerHTML = '';

        const monthStr = String(currentMonth).padStart(2, '0');
        const monthPrefix = `${YEAR}-${monthStr}-`;

        // 統計該月每個人請假天數
        const stats = {};
        Object.keys(leaveData).forEach(dateKey => {
            if (dateKey.startsWith(monthPrefix)) {
                leaveData[dateKey].forEach(item => {
                    if (!stats[item.name]) {
                        stats[item.name] = { count: 0, dept: item.dept };
                    }
                    stats[item.name].count++;
                });
            }
        });

        const staffList = [
            { name: 'Joe', dept: 'admin' },
            { name: '宇成', dept: 'admin' },
            { name: '怡伶', dept: 'nursing' },
            { name: '孟婷', dept: 'nursing' },
            { name: '涵方', dept: 'nursing' },
            { name: '姿姿', dept: 'beauty' },
            { name: '冠穎', dept: 'beauty' },
            { name: '欣亞', dept: 'beauty' },
            { name: '佳璇', dept: 'beauty' }
        ];

        staffList.forEach(s => {
            const count = stats[s.name] ? stats[s.name].count : 0;
            const item = document.createElement('div');
            item.className = `leave-tag ${s.dept}`;
            item.style.padding = '8px 14px';
            item.style.fontSize = '14px';
            item.innerHTML = `<strong>${s.name}</strong> (${getDeptName(s.dept)}): 本月預假 ${count} 天`;
            summaryContainer.appendChild(item);
        });
    }

    // 初始化頁面
    initMonthTabs();
    initStaffButtons();
    renderCalendar();
    renderSummary();
</script>

</body>
</html>
